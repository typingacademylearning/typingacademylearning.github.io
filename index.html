function currentChar(){return target[typed.length]||''}
function fingerFor(ch){return keyColors[ch.toLowerCase()]||'f-thumb'}
function keyboardHtml(){let rows=[['`','1','2','3','4','5','6','7','8','9','0','-','=','Backspace'],['Tab','q','w','e','r','t','y','u','i','o','p','[',']','\\'],['Caps','a','s','d','f','g','h','j','k','l',';','\'','Enter'],['Shift','z','x','c','v','b','n','m',',','.','/','Shift'],['Ctrl','Alt',' ','Alt','Ctrl']];return `<div class="keyboard" aria-label="Color-coded on-screen keyboard">${rows.map(row=>`<div class="key-row">${row.map(k=>{let low=k.toLowerCase(),wide=['Backspace','Tab','Caps','Enter','Shift','Ctrl','Alt'].includes(k),cls=keyColors[low]||'';if(k===' ')return `<div class="key space f-thumb" data-key=" ">Space</div>`;return `<div class="key ${wide?'wide':''} ${cls} ${currentChar().toLowerCase()===low?'active-key':''}" data-key="${esc(low)}">${esc(k)}</div>`}).join('')}</div>`).join('')}</div>`}
function targetHtml(){return target.split('').map((ch,i)=>{let cls=i<typed.length?'done':i===typed.length?'active':'';return `<span class="char ${cls}" data-char-index="${i}">${ch===' '?' ':esc(ch)}</span>`}).join('')}
function lessonView(){if(!lesson)return '<div class="empty-state">Choose a lesson.</div>';let l=lesson.level,idx=lesson.index,timed=isTimed(l),showGuide=l<=10&&state.settings.showFingerGuide;return `${head(`LEVEL ${String(l).padStart(2,'0')} · LESSON ${idx+1}`,esc(lesson.title),l<=7?'Learn each key without a countdown timer.':l<=10?'Timed practice with extra time to build confidence.':'Advanced timed practice · focus on speed and precision.',btn('← Exit Lesson','exit-lesson','secondary'))}
<div class="lesson-layout"><section class="lesson-panel"><div class="lesson-toolbar"><span class="eyebrow" style="color:#82b7ff">${l<=7?'LEARN AT YOUR PACE':l<=10?'TIMED PRACTICE':'ADVANCED ASSESSMENT'}</span><span id="timerDisplay" style="margin-left:auto;color:#b7c6dd;font-size:13px">${timed?'Time left: '+formatTime(remaining):'No countdown'}</span></div><h2 style="margin:8px 0 0;font-size:23px">Type the text below</h2><p class="lesson-sub" style="margin:4px 0">${showGuide?'Follow the matching finger color. Finger names are shown in English and Bengali.':'Type naturally. Review your performance after submitting.'}</p><div class="target-text" id="targetText">${targetHtml()}</div><div class="lesson-toolbar" style="margin-bottom:12px"><button class="btn btn-secondary" data-action="replay-word">🔊 Hear instructions</button><span class="small-muted" style="color:#b7c6dd">${typed.length} / ${target.length} characters</span><span style="flex:1"></span><button class="btn btn-secondary" data-action="reset-text">↻ Restart text</button></div><input class="typed-input" id="typingInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Click here, then type using your physical keyboard" aria-label="Typing practice input"><p class="lesson-sub" style="font-size:12px;margin:10px 0 0">${l<=10?'In beginner lessons, an incorrect key will not advance the target.':'Advanced mode lets you finish the text; errors are analyzed at the end.'}</p>${showGuide?keyboardHtml():''}<div class="lesson-toolbar" style="margin-top:18px"><button class="btn btn-primary" data-action="submit-lesson">${timed?'Submit Practice':'Complete Lesson'} →</button><button class="btn btn-secondary" data-action="next-text">Next Text</button></div></section>
<aside class="lesson-side"><div class="side-stat-grid"><div class="mini-stat"><small>WPM</small><strong id="liveWpm">0</strong></div><div class="mini-stat"><small>Accuracy</small><strong id="liveAcc">100%</strong></div><div class="mini-stat"><small>Errors</small><strong id="liveErrors">0</strong></div></div><section class="card"><div class="card-head"><h3>Current Key</h3><span class="small-muted">Finger guide</span></div><div class="focus-key"><div class="big-key" id="focusKey">${esc(currentChar()||'✓').toUpperCase()}</div><div><strong id="fingerEnglish">${showGuide?fingerInfo[fingerFor(currentChar())][0]:'Finger guidance off'}</strong><div id="fingerBangla" class="small-muted">${showGuide?fingerInfo[fingerFor(currentChar())][1]:'Advanced typing mode'}</div></div></div><div style="margin-top:15px" class="progress-bar"><span id="lessonProgressBar" style="width:${typed.length/target.length*100}%"></span></div><p class="small-muted" id="lessonProgressText">${typed.length} of ${target.length} characters</p></section>
<section class="card"><div class="card-head"><h3>Sound Settings</h3><span>🔊</span></div>${settingToggle('Word pronunciation','Speak lesson instruction','wordPronunciation',state.settings.wordPronunciation)}${settingToggle('Letter name on keypress','Name each correct letter','letterSound',state.settings.letterSound)}${settingToggle('Error sound','Sound on wrong key','errorSound',state.settings.errorSound)}<p class="small-muted">Sound follows your saved preferences. Advanced levels reduce guidance by default.</p></section><section class="card"><div class="card-head"><h3>Lesson Goal</h3></div><p class="small-muted">${l<=7?'Learn the key pattern and return to the home row.':l<=10?'Build accuracy first, then improve your speed.':'Finish within the time limit and review the detailed result.'}</p><div class="recent-item"><span class="status-dot">✓</span><div class="recent-text"><strong>${l<=7?'Correct finger placement':l<=10?'95% accuracy target':'Precision under pressure'}</strong><small>${l<=7?'No timer required':l<=10?'Practice goal':'Advanced goal'}</small></div></div></section></aside></div>`}
function speak(text){if(!('speechSynthesis'in window)||!text)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=Number(state.settings.speechRate)||1;u.volume=Math.max(0,Math.min(1,(state.settings.volume||70)/100));speechSynthesis.speak(u)}catch{}}
function tone(isError=false){if(!state.settings.errorSound&&isError)return;if(!isError&&!state.settings.correctSound)return;try{const ctx=new(window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=isError?190:660;g.gain.value=(state.settings.volume/100)*.06;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+(isError?.11:.06));o.onended=()=>ctx.close()}catch{}}
function startClock(){if(startedAt)return;startedAt=Date.now();if(timerId)clearInterval(timerId);timerId=setInterval(()=>{elapsed=Math.floor((Date.now()-startedAt)/1000);if(isTimed(lesson.level)){remaining--;if(remaining<=0){remaining=0;clearInterval(timerId);timerId=null;finishLesson(true);return}}updateLive()},1000)}
function updateLive(){if(page!=='lesson')return;let td=$('#timerDisplay');if(td)td.textContent=isTimed(lesson.level)?'Time left: '+formatTime(remaining):'No countdown';let w=$('#liveWpm'),a=$('#liveAcc'),e=$('#liveErrors');if(w)w.textContent=liveWpm();if(a)a.textContent=liveAccuracy()+'%';if(e)e.textContent=wrongCount;let key=$('#focusKey'),en=$('#fingerEnglish'),bn=$('#fingerBangla'),bar=$('#lessonProgressBar'),txt=$('#lessonProgressText');if(key)key.textContent=(currentChar()||'✓').toUpperCase();if(en&&lesson.level<=10&&state.settings.showFingerGuide){en.textContent=fingerInfo[fingerFor(currentChar())][0];bn.textContent=fingerInfo[fingerFor(currentChar())][1]}if(bar)bar.style.width=(typed.length/target.length*100)+'%';if(txt)txt.textContent=`${typed.length} of ${target.length} characters`;$('#targetText')&&($('#targetText').innerHTML=targetHtml());$$('.key').forEach(k=>k.classList.toggle('active-key',k.dataset.key===currentChar().toLowerCase()));}
function handleInputKey(e){if(page!=='lesson'||!lesson)return;const inp=$('#typingInput');if(!inp||document.activeElement!==inp)return;if(e.key==='Escape'){e.preventDefault();return}if(e.key==='Backspace'){e.preventDefault();if(lesson.level<=10){typed=typed.slice(0,-1);updateLive()}return}if(e.key.length!==1)return;e.preventDefault();startClock();rawKeys++;const expected=currentChar(),actual=e.key;if(actual===expected){typed+=actual;correctCount++;if(state.settings.letterSound&&lesson.level<=10&&/[a-z]/i.test(actual))speak(actual.toUpperCase());else tone(false);if(typed.length>=target.length){updateLive();finishLesson(false);return}}else{wrongCount++;if(lesson.level<=10){tone(true)}else{typed+=actual;correctCount+=0}}updateLive()}
function finishLesson(timeout=false){if(!lesson)return;if(timerId){clearInterval(timerId);timerId=null}elapsed=Math.max(1,Math.floor(startedAt?(Date.now()-startedAt)/1000:0));let accuracy=rawKeys?Math.max(0,Math.round(correctCount/rawKeys*100)):100;let wpm=Math.max(0,Math.round((correctCount/5)/(elapsed/60)));let h={level:lesson.level,title:lesson.title,date:new Date().toLocaleDateString('en-CA'),wpm,accuracy,errors:wrongCount,seconds:elapsed,timeout};state.history.push(h);if(state.history.length>100)state.history=state.history.slice(-100);let ref=`${lesson.level}-${lesson.index}`;if(!state.completed.includes(ref)&&(!timeout&&typed.length>=target.length)){state.completed.push(ref)}if(lesson.level<10&&levelProgress(lesson.level)===6)state.unlockedLevel=Math.max(state.unlockedLevel,lesson.level+1);if(lesson.level===10&&levelProgress(10)===6)state.unlockedLevel=Math.max(state.unlockedLevel,11);if(lesson.level>=11&&levelProgress(lesson.level)===6)state.unlockedLevel=Math.max(state.unlockedLevel,lesson.level+1);saveState();page='results';render();}
function resultsView(){let h=state.history[state.history.length-1];if(!h)return '<div class="empty-state">No result yet.</div>';return `${head('SESSION COMPLETE','Practice results',h.timeout?'Time is up. Review your performance and try again.':'Review your result before moving on.',btn('Back to Dashboard','page-dashboard','secondary'))}<div class="result-banner"><strong>${h.timeout?'Time is up':'Practice saved'}</strong><div>${h.title} · Level ${h.level} · ${h.date}</div></div><div class="result-numbers"><div class="result-number"><small>Net WPM (estimate)</small><strong>${h.wpm}</strong></div><div class="result-number"><small>Final-text accuracy*</small><strong>${h.accuracy}%</strong></div><div class="result-number"><small>Keystroke errors</small><strong>${h.errors}</strong></div><div class="result-number"><small>Elapsed time</small><strong>${formatTime(h.seconds)}</strong></div></div><section class="card"><h3>What to do next</h3><p class="sub">${h.accuracy<90?'Accuracy is the priority. Repeat this lesson slowly and focus on the correct finger for each key.':h.accuracy<95?'Good progress. Repeat the lesson and aim for 95% accuracy before moving on.':'Good work. Continue practicing to build consistency over multiple sessions.'}</p><div class="lesson-toolbar" style="margin-top:16px">${btn('Retry Lesson','retry-lesson')}${btn('Continue Learning →','continue')}</div><p class="small-muted" style="margin-top:14px">*Prototype metric note: the current front-end uses typed-key tracking for live feedback. Final-text comparison, corrected-error accounting, and production-grade scoring will be completed in the scoring-engine phase.</p></section>`}
function handleAction(a){if(a==='continue'){startLesson(state.currentLevel,state.currentLesson);return}if(a==='page-dashboard')return navigate('dashboard');if(a.startsWith('page-'))return navigate(a.slice(5));if(a==='page-courses')return navigate('courses');if(a==='page-progress')return navigate('progress');if(a==='page-practice')return navigate('practice');if(a==='exit-lesson'){if(timerId)clearInterval(timerId);timerId=null;return navigate('courses')}if(a==='replay-word'){speak(lesson?.title||'Typing practice');return}if(a==='reset-text'){if(lesson)openLesson(lesson.level,lesson.index);return}if(a==='next-text'){if(!lesson)return;targetSampleIndex++;let s=samples[targetSampleIndex%samples.length];lesson.title=s.title;lesson.text=s.text;target=s.text;typed='';wrongCount=0;correctCount=0;rawKeys=0;elapsed=0;startedAt=null;remaining=lesson.level===8?180:lesson.level===9?300:lesson.level===10?600:lesson.level>=11?120:0;render();return}if(a==='submit-lesson'){finishLesson(false);return}if(a==='retry-lesson'){startLesson(state.history[state.history.length-1].level,state.currentLesson);return}if(a==='export-results'){let csv='Lesson,Level,Date,WPM,Accuracy,Errors,Seconds\n'+state.history.map(h=>[JSON.stringify(h.title),h.level,h.date,h.wpm,h.accuracy,h.errors,h.seconds].join(',')).join('\n');let blob=new Blob([csv],{type:'text/csv'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='typing-academy-results.csv';link.click();URL.revokeObjectURL(url);return}if(a==='reset-demo'){if(confirm('Reset all demo progress saved in this browser?')){localStorage.removeItem('typingAcademyDemo');state=structuredClone(defaultState);navigate('dashboard')}return}if(a==='locked-level'){toast('This level is locked. Complete the preceding level first.');return}if(a==='locked-lesson'){toast('Complete the previous lesson to unlock this one.');return}if(a.startsWith('level-')){state.currentLevel=Number(a.slice(6));state.currentLesson=0;saveState();page='level';render();return}if(a.startsWith('start-')){let [,l,i]=a.split('-');return startLesson(Number(l),Number(i))}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){navigate(nav.dataset.page);return}const act=e.target.closest('[data-action]');if(act){handleAction(act.dataset.action);return}const st=e.target.closest('[data-setting]');if(st){const k=st.dataset.setting;state.settings[k]=!state.settings[k];saveState();render();return}});
document.addEventListener('change',e=>{if(e.target.id==='speechRate'){state.settings.speechRate=Number(e.target.value);saveState()}if(e.target.id==='volume'){state.settings.volume=Number(e.target.value);saveState()}});
document.addEventListener('keydown',handleInputKey);
$('#mobileMenu').addEventListener('click',()=>$('#topNav').classList.toggle('open'));
// Make sure the advanced notice is not dismissible by clicking its backdrop or pressing Escape.
document.addEventListener('keydown',e=>{if($('#advancedBackdrop')&&e.key==='Escape'){e.stopPropagation();e.preventDefault()}},true);
render();
})();
</script>
